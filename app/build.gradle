import com.github.triplet.gradle.androidpublisher.ReleaseStatus

plugins {
    id 'com.github.triplet.play' version '3.12.1'
    id 'de.undercouch.download' version '5.6.0'
}

apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

def isCi = System.getenv("CI") == "true"
android {
    namespace 'com.gianlu.aria2android'

    defaultConfig {
        compileSdk 36

        applicationId "com.gianlu.aria2android"
        minSdkVersion 21
        targetSdkVersion 36

        versionCode 77
        versionName "2.7.0"
    }
    buildFeatures {
        viewBinding true
    }

    if (isCi) {
        signingConfigs {
            release {
                storeFile file("../.github/keystore.jks")
                storePassword System.getenv("KEYSTORE_STORE_PASS")
                keyAlias = System.getenv("KEYSTORE_KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (isCi) signingConfig signingConfigs.release
        }
    }

    flavorDimensions = ['main']
    productFlavors {
        standard {
            dimension 'main'

            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                }
            }
        }

        foss {
            dimension 'main'

            buildTypes {
                release {
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        warning 'MissingTranslation', 'Instantiatable'
    }

    playConfigs {
        foss {
            commit.set(false)
            enabled.set(false)
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    compileSdk 36
}

play {
    defaultToAppBundles.set(true)
    enabled.set(isCi)
    serviceAccountCredentials.set(file("../.github/secrets.json"))
    track.set("production")
    releaseStatus.set(ReleaseStatus.DRAFT)
}

dependencies {
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation project(':aria2lib')
    implementation(project(':CommonUtils')) {
        exclude group: 'com.github.faruktoptas', module: 'FancyShowCaseView'
    }
}

apply plugin: 'com.google.gms.google-services'

tasks.register('downloadAriaNg', Download) {
    src 'https://github.com/mayswind/AriaNg/releases/download/1.3.11/AriaNg-1.3.11-AllInOne.zip'
    dest layout.buildDirectory.file('AriaNg-1.3.11-AllInOne.zip')
    overwrite false
}

tasks.register('installAriaNg', Copy) {
    dependsOn downloadAriaNg
    from zipTree(tasks.downloadAriaNg.dest)
    into project.file('src/main/assets/ariang')
}
tasks.named("preBuild").configure {
    dependsOn tasks.installAriaNg
}
tasks.named('clean').configure {
    delete project.file('src/main/assets/ariang')
}